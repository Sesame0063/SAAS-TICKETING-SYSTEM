[package]
name = "api"
version = "0.1.0"
edition = "2024"
authors = ["Saswat Mohanty"]
description = "Production-ready SaaS Customer Ticketing System Backend built with Rust and Axum."
license = "MIT"

[dependencies]

# ==========================================================
# Async Runtime
# ==========================================================

tokio = { version = "1", features = ["full"] }

# ==========================================================
# Web Framework
# ==========================================================

axum = { version = "0.8", features = [
    "macros",
    "multipart",
    "ws"
] }

tower = "0.5"
tower-http = { version = "0.6", features = [
    "cors",
    "compression-full",
    "request-id",
    "timeout",
    "set-header",
    "limit"
] }

# ==========================================================
# Async Trait
# ==========================================================

async-trait = "0.1"

# ==========================================================
# Serialization
# ==========================================================

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ==========================================================
# Validation
# ==========================================================

validator = { version = "0.20", features = ["derive"] }
regex = "1"

# ==========================================================
# Environment
# ==========================================================

dotenvy = "0.15"

# ==========================================================
# Database
# ==========================================================

sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros"
] }

# ==========================================================
# Redis
# ==========================================================

redis = { version = "0.32", features = ["tokio-comp"] }

# ==========================================================
# Security
# ==========================================================

argon2 = "0.5"
jsonwebtoken = "9"
rand_core = { version = "0.6", features = ["std"] }

# ==========================================================
# Logging
# ==========================================================

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ==========================================================
# Error Handling
# ==========================================================

thiserror = "2"
anyhow = "1"

# ==========================================================
# UUID
# ==========================================================

uuid = { version = "1", features = [
    "v4",
    "serde"
] }

# ==========================================================
# Date & Time
# ==========================================================

chrono = { version = "0.4", features = ["serde"] }

# ==========================================================
# Email (SMTP)
# ==========================================================

lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-native-tls"
] }

# ==========================================================
# File Upload Helpers
# ==========================================================

mime = "0.3"
infer = "0.19"
sanitize-filename = "0.6"

# ==========================================================
# HTML Templates
# ==========================================================

askama = "0.14"

# ==========================================================
# WebSocket
# ==========================================================

futures-util = "0.3"
printpdf = "0.12.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
